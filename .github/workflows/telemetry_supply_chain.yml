name: Talent Market Telemetry (Supply Chain & Operations Roles)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform data connector"
        required: true
        type: choice
        default: "both"
        options:
          - "both"
          - "linkedin"
          - "indeed"
      location:
        description: "Target location"
        required: false
        type: string
        default: "India"
      country:
        description: "Indeed country code"
        required: false
        type: string
        default: "india"
      auto_split:
        description: "Auto state split for capped searches"
        required: false
        type: boolean
        default: false
      post_time:
        description: "Job posting age filter"
        required: false
        type: choice
        default: "2weeks"
        options:
          - "2weeks"
          - "week"
          - "day"
          - "month"
          - "any"

permissions:
  contents: read

jobs:
  telemetry-worker:
    name: "Shard ${{ matrix.shard }}/8"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 python-jobspy pandas python-dotenv curl_cffi openpyxl

      - name: Execute Telemetry Pipeline
        env:
          RESIDENTIAL_PROXY: ${{ secrets.RESIDENTIAL_PROXY }}
          PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY }}
        run: |
          PROXY_ARG=""
          if [ -n "${{ secrets.RESIDENTIAL_PROXY }}" ]; then
            PROXY_ARG="--proxy ${{ secrets.RESIDENTIAL_PROXY }}"
          fi
          python3 tools/run_sharded_roles.py \
            --role-set supply_chain \
            --platform "${{ github.event.inputs.platform || 'both' }}" \
            --shard ${{ matrix.shard }} \
            --total-shards 8 \
            --post-time "${{ github.event.inputs.post_time || '2weeks' }}" \
            $PROXY_ARG

      - name: Upload Shard Output Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "shard-output-${{ matrix.shard }}"
          path: |
            **/*.csv
            **/*.json
          retention-days: 1

  merge-and-package:
    name: "Merge Shards & Create Zip"
    needs: telemetry-worker
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install pandas openpyxl

      - name: Download All Shards
        uses: actions/download-artifact@v4
        with:
          path: ./shards
          pattern: "shard-output-*"
          merge-multiple: true

      - name: Merge, Deduplicate & Build Excel
        run: |
          python3 -c '
          import os, glob, pandas as pd

          csv_files = glob.glob("./shards/**/*.csv", recursive=True) + glob.glob("./shards/*.csv")
          print(f"Discovered {len(csv_files)} CSV files to merge.")

          dfs = []
          for f in set(csv_files):
              try:
                  df = pd.read_csv(f, dtype=str)
                  if not df.empty:
                      dfs.append(df)
              except Exception as e:
                  print(f"Skipping {f}: {e}")

          os.makedirs("deliverables", exist_ok=True)

          if dfs:
              merged = pd.concat(dfs, ignore_index=True)
              # Deduplicate by job URL or title+company
              dedup_col = "job_url" if "job_url" in merged.columns else ("id" if "id" in merged.columns else None)
              if dedup_col:
                  merged = merged.drop_duplicates(subset=[dedup_col])
              else:
                  merged = merged.drop_duplicates()

              print(f"Merged total unique jobs: {len(merged)}")
              merged.to_csv("deliverables/supply_chain_jobs_all.csv", index=False)
              
              with pd.ExcelWriter("deliverables/supply_chain_jobs.xlsx", engine="openpyxl") as writer:
                  merged.to_excel(writer, sheet_name="All Jobs", index=False)
          else:
              print("No CSV records found.")
              pd.DataFrame().to_csv("deliverables/supply_chain_jobs_all.csv", index=False)
          '

      - name: Package Deliverables into Zip Archive
        run: |
          zip -9 supply_chain_jobs_dataset.zip deliverables/* || true
          ls -lh supply_chain_jobs_dataset.zip || true

      - name: Upload Final Deliverable Zip
        uses: actions/upload-artifact@v4
        with:
          name: "supply-chain-jobs-dataset"
          path: supply_chain_jobs_dataset.zip
          retention-days: 7

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-market-analytics"
version = "1.0.0"
description = "Labor market intelligence, skills demand analysis, and job taxonomy mapping pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Talent Analytics Group" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "httpx>=0.25.0",
  "beautifulsoup4>=4.12.0",
  "curl-cffi>=0.7.0",
  "pandas>=2.0.0",
  "python-dotenv>=1.0.0",
  "openpyxl>=3.1.0"
]
